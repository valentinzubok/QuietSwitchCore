name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Format check
        run: black --check contracts tests
      - name: Lint
        run: flake8 contracts tests --max-line-length=100 --ignore=E501,W503,E203,E402,F403,F405
      - name: Tests
        run: python3 -m pytest -q
      - name: Deployed code equals this source
        run: python3 scripts/verify_deployment.py
